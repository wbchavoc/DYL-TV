name: Update DYL-TV playlists

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths:
      - build.py
      - .github/workflows/update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Wi-Fi, cellular, and backup playlists
        run: python3 build.py
      - name: Publish playlists and status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channels.m3u channels-cellular.m3u channels-backup.m3u missing-channels.txt stream-report.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh DYL-TV playlists'
            git push
          fi
